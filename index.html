<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Usage Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <!-- Header & Controls -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border gap-4">
            <div>
                <h1 class="text-xl font-bold text-gray-800">⛽ Dashboard บันทึกยอดน้ำมัน</h1>
                <p class="text-xs text-gray-500">ระบบบันทึก ตรวจสอบ และจัดการข้อมูลแบบเรียลไทม์</p>
            </div>
            <div class="flex items-center gap-2">
                <select id="sheetSelect" onchange="loadData()" class="border rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 font-medium">
                    <option>กำลังโหลด...</option>
                </select>
                <button onclick="openCreateModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                    + เพิ่มวันใหม่
                </button>
                <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                    + บันทึกยอด
                </button>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border">
                <p class="text-xs text-gray-500 font-medium">ยอดรวมน้ำมัน (กระเป๋า)</p>
                <h3 id="totalAmountDisplay" class="text-3xl font-bold text-blue-600 mt-1">0</h3>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border">
                <p class="text-xs text-gray-500 font-medium">จำนวนรายการวันนี้</p>
                <h3 id="totalCountDisplay" class="text-3xl font-bold text-gray-800 mt-1">0</h3>
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b">
                        <th class="p-4 font-semibold">ชื่อ</th>
                        <th class="p-4 font-semibold">จำนวน (กระเป๋า)</th>
                        <th class="p-4 font-semibold">หลักฐาน (รูปภาพ)</th>
                        <th class="p-4 font-semibold text-center">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="dataTable" class="divide-y divide-gray-100 text-sm">
                    <tr><td colspan="4" class="p-6 text-center text-gray-400">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal: เพิ่ม/แก้ไขข้อมูล -->
    <div id="addModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-md shadow-xl">
            <h3 id="modalTitle" class="text-lg font-bold text-gray-800 mb-4">📝 บันทึกข้อมูลการใช้น้ำมัน</h3>
            <input type="hidden" id="editRowId" value="">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">ชื่อ</label>
                    <input type="text" id="inputName" placeholder="" class="w-full border rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">จำนวน (กระเป๋า)</label>
                    <input type="number" id="inputAmount" placeholder="" class="w-full border rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">ถ่ายรูปหลักฐานใหม่ (ถ้าต้องการเปลี่ยน)</label>
                    <input type="file" id="inputImageFile" accept="image/*" capture="environment" class="w-full border rounded-xl px-3 py-2 text-sm bg-gray-50 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeAddModal()" class="px-4 py-2 text-gray-600 text-sm hover:bg-gray-100 rounded-xl">ยกเลิก</button>
                <button onclick="submitData()" id="submitBtn" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-xl hover:bg-blue-700 font-medium">บันทึก</button>
            </div>
        </div>
    </div>

    <!-- Modal: สร้างวันใหม่ -->
    <div id="createModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-xs shadow-xl">
            <h3 class="text-lg font-bold text-gray-800 mb-2">📅 เพิ่มวันที่ใช้งานใหม่</h3>
            <input type="text" id="newDateInput" placeholder="DD/MM/YY" class="w-full border rounded-xl px-3 py-2 text-sm mb-4 outline-none focus:ring-2 focus:ring-emerald-500">
            <div class="flex justify-end gap-2">
                <button onclick="closeCreateModal()" class="px-3 py-2 text-gray-600 text-sm hover:bg-gray-100 rounded-xl">ยกเลิก</button>
                <button onclick="submitNewSheet()" class="px-3 py-2 bg-emerald-600 text-white text-sm rounded-xl hover:bg-emerald-700 font-medium">สร้างแท็บ</button>
            </div>
        </div>
    </div>

    <!-- Modal: ดูรูปภาพขนาดใหญ่ -->
    <div id="imageModal" class="fixed inset-0 bg-black bg-opacity-80 hidden flex items-center justify-center p-4 z-50" onclick="closeImageModal()">
        <img id="fullImage" class="max-w-full max-h-[90vh] rounded-xl shadow-2xl">
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxMFhWRuudyy4ukT5Pjuw_j20PRqwbW8TQB8I6Y1sfdLOOOYyskDnKeqeM6bt4N4dxeBA/exec";

        window.onload = function() { initSheets(); };

        function initSheets() {
            fetch(WEB_APP_URL + "?action=getSheets")
            .then(res => res.json())
            .then(sheets => {
                let select = document.getElementById('sheetSelect');
                select.innerHTML = '';
                sheets.forEach(sheet => {
                    let opt = document.createElement('option');
                    opt.value = sheet;
                    opt.textContent = sheet;
                    select.appendChild(opt);
                });
                loadData();
            });
        }

        function loadData() {
            let currentSheet = document.getElementById('sheetSelect').value;
            if (!currentSheet) return;

            fetch(WEB_APP_URL + "?sheet=" + encodeURIComponent(currentSheet))
            .then(res => res.json())
            .then(data => {
                document.getElementById('totalAmountDisplay').textContent = data.total || 0;
                document.getElementById('totalCountDisplay').textContent = data.items ? data.items.length : 0;

                let tbody = document.getElementById('dataTable');
                tbody.innerHTML = '';

                if (!data.items || data.items.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-gray-400">ยังไม่มีข้อมูลในวันนี้</td></tr>`;
                    return;
                }

                data.items.forEach(item => {
                    let proofHtml = item.proof ? `<img src="${item.proof}" onclick="openImageModal('${item.proof}')" class="w-12 h-12 object-cover rounded-lg cursor-pointer hover:opacity-80 border shadow-sm">` : `<span class="text-gray-400 italic text-xs">ไม่มีรูปภาพ</span>`;
                    
                    let tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition border-b border-gray-100";
                    tr.innerHTML = `
                        <td class="p-4 text-gray-800 font-medium">${item.name}</td>
                        <td class="p-4 text-gray-800">${item.amount}</td>
                        <td class="p-4">${proofHtml}</td>
                        <td class="p-4 text-center space-x-2">
                            <button onclick="openEditModal(${item.rowId}, '${item.name}', '${item.amount}')" class="text-blue-500 hover:text-blue-700 text-xs font-medium">แก้ไข</button>
                            <button onclick="deleteRow(${item.rowId})" class="text-red-500 hover:text-red-700 text-xs font-medium">ลบ</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = "📝 บันทึกข้อมูลการใช้น้ำมัน";
            document.getElementById('editRowId').value = "";
            document.getElementById('inputName').value = "";
            document.getElementById('inputAmount').value = "";
            document.getElementById('inputImageFile').value = "";
            document.getElementById('addModal').classList.remove('hidden');
        }

        function openEditModal(rowId, name, amount) {
            document.getElementById('modalTitle').textContent = "✏️ แก้ไขข้อมูลการใช้น้ำมัน";
            document.getElementById('editRowId').value = rowId;
            document.getElementById('inputName').value = name;
            document.getElementById('inputAmount').value = amount;
            document.getElementById('inputImageFile').value = "";
            document.getElementById('addModal').classList.remove('hidden');
        }

        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }
        function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); }
        function closeCreateModal() { document.getElementById('createModal').classList.add('hidden'); }
        
        function openImageModal(src) {
            document.getElementById('fullImage').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeImageModal() { document.getElementById('imageModal').classList.add('hidden'); }

        function submitNewSheet() {
            let dateVal = document.getElementById('newDateInput').value;
            if (!dateVal) return alert('กรุณากรอกวันที่');

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'createSheet', date: dateVal })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('สร้างแท็บสำเร็จ!');
                    location.reload(); // รีเฟรชหน้าเว็บ
                } else {
                    alert(data.message);
                }
            });
        }

        function submitData() {
            let currentSheet = document.getElementById('sheetSelect').value;
            let editRowId = document.getElementById('editRowId').value;
            let name = document.getElementById('inputName').value;
            let amount = document.getElementById('inputAmount').value;
            let fileInput = document.getElementById('inputImageFile');

            if (!name || !amount) return alert('กรุณากรอกชื่อและจำนวนให้ครบถ้วน');

            let submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = "กำลังบันทึก...";
            submitBtn.disabled = true;

            let actionType = editRowId ? 'updateData' : 'addData';

            if (fileInput.files.length > 0) {
                let file = fileInput.files[0];
                let reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function () {
                    sendToServer(actionType, currentSheet, editRowId, name, amount, reader.result);
                };
            } else {
                sendToServer(actionType, currentSheet, editRowId, name, amount, "");
            }
        }

        function sendToServer(action, sheet, rowId, name, amount, imgBase64) {
            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: action, 
                    sheet: sheet, 
                    rowId: rowId,
                    name: name, 
                    amount: amount, 
                    imgBase64: imgBase64 
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    location.reload(); // รีเฟรชหน้าเว็บ 1 ครั้งอัตโนมัติเพื่อให้ข้อมูลตรงกันเป๊ะ
                } else {
                    alert("เกิดข้อผิดพลาดในการบันทึก");
                    let submitBtn = document.getElementById('submitBtn');
                    submitBtn.textContent = "บันทึก";
                    submitBtn.disabled = false;
                }
            });
        }

        function deleteRow(rowId) {
            if (!confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) return;
            let currentSheet = document.getElementById('sheetSelect').value;

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'deleteData', sheet: currentSheet, rowId: rowId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') { 
                    location.reload(); // รีเฟรชหน้าเว็บ 1 ครั้งหลังลบข้อมูลเสร็จ
                }
            });
        }
    </script>
</body>
</html>
